    - do reprezentowania
    - udzielania dalszych pełnomocnictw
    - zakres pełnomocnictwa
    - pełnomocnik jest umocowany
    - może zostać odwołane
    - upoważniam
    - pełnomocnikom do
    - pełnomocnicy
  titles:
    - Pełnomocnictwo
    - Pełnomocnictwo procesowe
    - Pełnomocnictwo szczególne
