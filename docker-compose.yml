x-app: &app
  build: .
  image: odwolania2json:latest
  env_file:
    - path: .env
      required: false
  volumes:
    - ./input:/app/input
    - ./output:/app/output
    - ./meta:/app/meta
    - ./config:/app/config:ro
    # Klucz LLM (np. konto usługi Google) — montowany tylko do odczytu, nigdy w obrazie.
    - ./secrets:/app/secrets:ro
    - ./cache:/app/cache

services:
  # Przetwarzanie wsadowe input/ -> output/ (uruchamiane przez start.bat / start.sh):
  #   docker compose run --rm cli
  cli:
    <<: *app
    command: python -m src process
    profiles: ["batch"]

  # API + GUI: docker compose up -d  ->  http://localhost:8501
  api:
    <<: *app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    <<: *app
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501 --server.maxUploadSize 50 --client.toolbarMode viewer
    environment:
      API_URL: http://api:8000
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

  # Testy / narzędzia deweloperskie: docker compose run --rm tests
  # Kod (src, tests, ui) montowany z dysku — zmiany nie wymagają przebudowy obrazu.
  # Dane organizatora (UZP_DATA_DIR) montowane tylko do odczytu w /data.
  tests:
    <<: *app
    command: pytest -q
    environment:
      DATA_DIR: /data
      # Ochrona budżetu: kontener narzędziowy domyślnie NIE woła płatnego API.
      # Świadome użycie LLM: docker compose run --rm -e LLM_PROVIDER=openai tests ...
      LLM_PROVIDER: none
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./meta:/app/meta
      - ./config:/app/config:ro
      - ./src:/app/src
      - ./ui:/app/ui
      - ./tests:/app/tests
      - ./docs:/app/docs:ro
      - ./reports:/app/reports
      - ./secrets:/app/secrets:ro
      - ./cache:/app/cache
      - ${UZP_DATA_DIR:-./dane}:/data:ro
    profiles: ["tools"]
